<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Pedidos</title>

    <script src="signalr.js"></script>
</head>
<body>

    <h1>Historial de Solicitudes</h1>

    <!-- Botón estático fuera del script -->
    <button id="btnActualizar">Actualizar</button>
    <br><br>

    <table border="1">
        <thead>
            <tr>
                <th>Cliente</th>
                <th>Teléfono</th>
                <th>Talla</th>
                <th>Origen</th>
                <th>Destino</th>
                <th>Fecha</th>
                <th>Estado</th>
            </tr>
        </thead>
        <tbody id="tablaCuerpo">
        </tbody>
    </table>

    <script>
        const btnActualizar = document.getElementById("btnActualizar");
        const listaPedidos = [];

        const conexion = new signalR.HubConnectionBuilder()
            .withUrl("https://localhost:7036/pedido")
            .withAutomaticReconnect()
            .build();

        function agregarFilaTabla(pedido) {
            const tbody = document.getElementById("tablaCuerpo");
            const fila = document.createElement("tr");

            fila.innerHTML = `
                <td>${pedido.nombre}</td>
                <td>${pedido.telefono}</td>
                <td>${pedido.talla} cm</td>
                <td>${pedido.origenLat}, ${pedido.origenLng}</td>
                <td>${pedido.destinoLat}, ${pedido.destinoLng}</td>
                <td>${pedido.fecha}</td>
                <td>${pedido.estado}</td>
            `;

            tbody.appendChild(fila);
        }

        // Cargar pedido guardado al iniciar
        window.addEventListener('DOMContentLoaded', () => {
            const pedidoGuardado = localStorage.getItem("pedidoCliente");
            if (pedidoGuardado) {
                const p = JSON.parse(pedidoGuardado);
                const pedidoObj = {
                    id: Date.now(),
                    nombre: p.nombre,
                    telefono: p.telefono,
                    talla: p.talla,
                    origenLat: p.origen,
                    origenLng: p.origen2,
                    destinoLat: p.destino,
                    destinoLng: p.destino2,
                    fecha: new Date().toLocaleDateString(),
                    estado: "Pendiente"
                };
                listaPedidos.push(pedidoObj);
                agregarFilaTabla(pedidoObj);
            }
        });

        // Escuchar nuevo pedido desde SignalR
        conexion.on("pedido", function (nombre, telefono, talla, origen, origen2, destino, destino2, fecha) {
            const pedido = {
                id: Date.now(),
                nombre,
                telefono,
                talla,
                origenLat: origen,
                origenLng: origen2,
                destinoLat: destino,
                destinoLng: destino2,
                fecha: fecha || new Date().toLocaleDateString(),
                estado: "Pendiente"
            };

            listaPedidos.push(pedido);
            agregarFilaTabla(pedido);
        });

        // Evento del botón para redirigir a MapaVista.html
        btnActualizar.addEventListener("click", () => {
            const pedidoGuardado = localStorage.getItem("pedidoCliente");

            if (pedidoGuardado) {
                const pedido = JSON.parse(pedidoGuardado);
                localStorage.setItem("pedidoSeleccionado", JSON.stringify(pedido));
                window.location.href = "MapaVista.html";
            } else if (listaPedidos.length > 0) {
                const ultimoPedido = listaPedidos[listaPedidos.length - 1];
                localStorage.setItem("pedidoSeleccionado", JSON.stringify(ultimoPedido));
                window.location.href = "MapaVista.html";
            } else {
                alert("No hay ningún pedido registrado para actualizar.");
            }
        });

        conexion.start()
            .then(() => console.log("Conectado"))
            .catch(err => console.error("Error SignalR:", err));
    </script>
</body>
</html>
